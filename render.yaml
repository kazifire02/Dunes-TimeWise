services:
  - type: web
    name: dunes-timewise
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL_POOLED
        sync: false
      - key: LATETRACK_SECRET_KEY
        generateValue: true
