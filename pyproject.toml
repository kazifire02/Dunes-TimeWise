[project]
name = "dunes-timewise"
version = "1.0.0"
description = "Dunes TimeWise attendance app, PostgreSQL and Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pg8000==1.31.6",
    "pycryptodome==3.23.0",
    "tzdata==2026.6",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["workers-py==1.17.9", "workers-runtime-sdk==1.9.5", "pytest>=9,<10", "uv>=0.13.4,<0.14"]
migration = ["mysql-connector-python>=9,<10"]
